<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Morgenfit">
<meta name="theme-color" content="#c06a55">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Morgenfit zu zweit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday, warm and encouraging, readable from the mat
   IDEA a gym interval clock on the wall at sunrise
   PICTURE huge countdown with an animated stick figure doing the move
   COLOUR sunrise coral for work, deep indigo for rest, sun yellow for warm-up and wins
   TYPE Barlow Condensed for numbers and titles, Barlow for text
   LAYOUT iPad landscape: figure left, clock right; portrait/phone: stacked */
:root{color-scheme:light dark;--bg:light-dark(#fff6ef,#17141f);--card:light-dark(#ffffff,#221e2c);--ink:light-dark(#1d1a24,#f5efe9);--soft:light-dark(#6b6470,#b9b0bd);--line:light-dark(#efe1d6,#352f40);--co:#c06a55;--in:#55658f;--sun:#efd9a4;--ok:#6f9f7f}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
h1,h2,h3,.num{font-family:"Barlow Condensed",Barlow,sans-serif;letter-spacing:-.01em;line-height:1.05;margin:0}
h1{font-size:clamp(34px,5vw,48px)}
h2{font-size:28px;margin-bottom:10px}
h3{font-size:22px}
button,a.btn{font:inherit;font-weight:600;border:0;border-radius:14px;min-height:48px;padding:10px 18px;cursor:pointer;color:inherit;background:var(--line);text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.go{background:var(--co);color:#fff;font-size:24px;min-height:68px;width:100%;font-family:"Barlow Condensed",sans-serif;letter-spacing:.01em}
.go:active{transform:scale(.98)}
#app{height:100%;display:grid;grid-template-rows:minmax(0,1fr) auto}
main{overflow-y:auto;padding:max(20px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 28px max(18px,env(safe-area-inset-left))}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:18px}
nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border-radius:0;min-height:68px;font-size:18px;color:var(--soft)}
nav button.on{color:var(--co);box-shadow:inset 0 3px 0 var(--co)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px}
.meta{color:var(--soft);font-size:15px}
.quote{background:var(--sun);color:#2a2100;border:0}
.quote p{font-family:"Barlow Condensed",sans-serif;font-size:clamp(26px,3.6vw,36px);line-height:1.12;margin:0 0 12px;font-weight:600;text-wrap:balance}
.quote button{background:#2a210018;color:#2a2100}
.today{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media(max-width:760px){.today{grid-template-columns:minmax(0,1fr)}}
.plist{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0 18px}
@media(max-width:520px){.plist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pitem{background:var(--bg);border-radius:14px;padding:8px 10px 10px;font-size:15px;font-weight:600;line-height:1.2}
.pitem svg{width:100%;height:auto;display:block;color:var(--ink)}
.pick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.pick button{min-height:44px;padding:6px 14px;font-size:16px}.pick button.on{background:var(--ink);color:var(--bg)}.pitem.xtra{outline:2px dashed var(--co);outline-offset:-2px}
.songs{columns:2 260px;column-gap:24px;margin:8px 0;padding-left:28px;font-size:16px}.songs li{break-inside:avoid}
.ringbox{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px;align-items:center}
.ring text{font-family:"Barlow Condensed",sans-serif;fill:var(--ink)}
.big{font-size:44px;font-family:"Barlow Condensed",sans-serif;font-weight:700;line-height:1}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{display:inline-block;background:var(--line);border-radius:99px;padding:3px 12px;font-size:14px;font-weight:600}
.exgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.prep{background:var(--co);color:#fff;border:0}
.exgrid p{font-size:19px;line-height:1.45}.need{margin:0;padding-left:22px;font-size:19px;line-height:1.5}
.exgrid svg{width:100%;height:auto;background:var(--bg);border-radius:14px;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(9em,1fr));gap:12px}
.cal{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:6px;font-size:14px;align-items:center}
.cal i{display:block;height:34px;border-radius:9px;background:var(--line);font-style:normal;text-align:center;line-height:34px;font-size:13px;color:var(--soft)}
.cal i.t{background:var(--co);color:#fff}.cal i.s{background:var(--in);color:#fff}.cal i.ts{background:linear-gradient(135deg,var(--co) 50%,var(--in) 50%);color:#fff}
.cal i.now{outline:2px solid var(--ink)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.badge{border-radius:16px;padding:12px;background:var(--bg);border:1px dashed var(--line);color:var(--soft)}
.badge.got{background:var(--co);color:#fff;border:0}
.badge b{display:block;font-size:17px}
.bar{height:10px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}.bar span{display:block;height:100%;background:var(--co)}
.rew{display:grid;gap:12px}
label.f{display:grid;gap:4px;font-weight:600;font-size:15px}
input,select{font:inherit;font-size:16px;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:8px 12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.sw{display:flex;align-items:center;gap:10px;font-weight:600}.sw input{width:26px;min-height:26px;accent-color:var(--co)}
details summary{cursor:pointer;font-weight:700;font-size:18px;min-height:44px;display:flex;align-items:center}
ol{padding-left:22px}
/* training overlay */
#tr{position:fixed;inset:0;display:none;grid-template-rows:auto minmax(0,1fr) auto;color:#fff;background:var(--co);padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));transition:background .5s}
#tr.show{display:grid}
#tr.pause,#tr.sw{background:var(--in)}#tr.warm,#tr.cool,#tr.intro{background:var(--sun);color:#2a2100}#tr.done{background:var(--card);color:var(--ink)}
.prog{height:8px;border-radius:9px;background:#ffffff40;overflow:hidden}.prog span{display:block;height:100%;background:currentColor;width:0}
.top{display:grid;gap:10px}
.topline{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;font-weight:600;font-size:20px;align-items:center}
.topline .clk{width:clamp(96px,14vw,140px);height:clamp(96px,14vw,140px)}
.clk{width:76px;height:76px;flex:none}.hdr{display:flex;justify-content:space-between;gap:16px;align-items:center}.hdr .clk{width:110px;height:110px}
.stage{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:center}
@media(max-aspect-ratio:1/1),(max-width:700px){.stage{grid-template-columns:minmax(0,1fr);gap:8px;align-content:center}}
.stage svg{width:100%;max-height:66vh;color:currentColor}
@media(max-aspect-ratio:1/1),(max-width:700px){.stage svg{max-height:48vh}}
.clock{text-align:center}
.lab{font-size:clamp(20px,3vw,28px);font-weight:600;opacity:.9}
.exn{font-family:"Barlow Condensed",sans-serif;font-size:clamp(30px,4.4vw,52px);font-weight:700;line-height:1.02;text-wrap:balance}
.sec{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(80px,13vw,180px);line-height:.9;font-variant-numeric:tabular-nums}
.tip{font-size:clamp(22px,3.2vw,32px);line-height:1.3;max-width:32ch;margin:6px auto 0;text-wrap:balance}
.ctr{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctr button,.ctr a{background:#ffffff2e;color:inherit;min-width:170px;min-height:72px;font-size:22px;padding:12px 28px;border-radius:18px}
@media(max-width:600px){.ctr button,.ctr a{min-width:0;flex:1 1 40%;font-size:19px}}
#tr.warm .ctr button,#tr.cool .ctr button,#tr.intro .ctr button,#tr.warm .ctr a,#tr.cool .ctr a{background:#2a21001c}
.intro-q{font-family:"Barlow Condensed",sans-serif;font-size:clamp(36px,6vw,72px);font-weight:700;line-height:1.05;text-align:center;max-width:22ch;margin:0 auto;text-wrap:balance}
.donebox{max-width:760px;margin:0 auto;display:grid;gap:16px;overflow-y:auto;align-content:start;padding-top:10px}
.knee{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.amp{display:flex;gap:8px}
.amp button{min-width:84px;font-size:15px;border:2px solid transparent}
.amp button.g.on{background:var(--ok);color:#fff}.amp button.y.on{background:var(--sun);color:#2a2100}.amp button.r.on{background:var(--co);color:#fff}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg button.on{background:var(--ink);color:var(--bg)}
#conf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;display:none}#conf.on{display:block}
.new{background:var(--co);color:#fff;border-radius:16px;padding:12px 16px;font-weight:600}
@media(prefers-reduced-motion:reduce){#tr{transition:none}}
</style>
</head>

<script>
{

// ---------- Training
const T=document.getElementById('tr');let R=null,wake=null;
function steps(){const s=S.set,a=[{k:'warm',ex:WARM,s:s.warm}];for(let r=1;r<=s.rounds;r++)exs().forEach((x,i)=>{a.push({k:'pause',ex:x,s:s.pause,r,i});if(x.side){const h1=Math.round(s.work/2);a.push({k:'work',ex:x,s:h1,r,i,part:1});a.push({k:'sw',ex:x,s:3,r,i});a.push({k:'work',ex:x,s:s.work-h1,r,i,part:2})}else a.push({k:'work',ex:x,s:s.work,r,i})});a.push({k:'cool',ex:COOL,s:s.cool});return a}
async function startTraining(){
 unlock();try{wake=await navigator.wakeLock?.request('screen')}catch(e){}
 const st=steps();R={st,i:-1,left:0,paused:false,total:st.reduce((a,b)=>a+b.s,0),before:got(stats())};
 T.className='show intro';
 T.innerHTML=`<div></div><div style="display:grid;align-content:center;gap:28px"><div class="intro-q">„${esc(spruch())}“</div></div><div class="ctr"><button id="skipi">Los geht's</button><button id="endi">Abbrechen</button></div>`;
 let gone=false;const go=()=>{if(gone)return;gone=true;countdown()};
 document.getElementById('skipi').onclick=go;document.getElementById('endi').onclick=close;
 say(['morgen',sprO().id],()=>setTimeout(go,1200));
}
function countdown(){
 let n=3;T.innerHTML=`<div></div><div class="clock" style="align-self:center"><div class="lab">Gleich geht's los</div><div class="sec" id="cd">3</div></div><div></div>`;
 beep(700);const iv=setInterval(()=>{n--;if(!R){clearInterval(iv);return}if(n>0){document.getElementById('cd').textContent=n;beep(700)}else{clearInterval(iv);next()}},1000);
}
function next(){
 R.i++;if(R.i>=R.st.length)return finish();
 const p=R.st[R.i];R.left=p.s;R.half=false;
 T.className='show '+p.k;
 const lbl=p.k==='pause'?(p.r>1&&p.i===0?`Runde ${p.r} · Als Nächstes`:'Pause · Als Nächstes'):p.k==='work'?`${p.i>5?'Zusatzübung':'Übung '+(p.i+1)+' von 6'} · Runde ${p.r} von ${S.set.rounds}${p.part?' · Seite '+p.part:''}`:p.k==='sw'?'Wechsel':p.k==='warm'?'Aufwärmen':'Ausklang';
 T.innerHTML=`<div class="top"><div class="prog"><span id="pg"></span></div><div class="topline"><span>${lbl}</span>${clockSVG()}<span id="rest" style="text-align:right"></span></div></div>
 <div class="stage">${figSVG(p.ex.id)}<div class="clock"><div class="exn">${esc(p.ex.name)}</div><div class="sec" id="sec">${p.s}</div><div class="tip">${p.k==='sw'?'Seite wechseln und in Position gehen.':esc(p.ex.tip)}</div></div></div>
 <div class="ctr"><button id="pz">Pause</button><button id="sk">Überspringen</button>${p.ex.v?`<a class="btn" href="${p.ex.v}" target="_blank" rel="noopener">Video</a>`:''}<button id="en">Beenden</button></div>`;
 document.getElementById('pz').onclick=e=>{R.paused=!R.paused;e.target.textContent=R.paused?'Weiter':'Pause';if(R.paused)stopSay()};
 document.getElementById('sk').onclick=()=>next();
 const en=document.getElementById('en');en.onclick=()=>{if(en.dataset.c)close();else{en.dataset.c=1;en.textContent='Wirklich beenden?'}};
 if(p.k==='warm'){gong();say(['warm1','warm2'])}
 else if(p.k==='pause')say([p.r>1&&p.i===0?'r'+p.r:'pause','Als Nächstes: '+p.ex.name+'.',p.ex.tip]);
 else if(p.k==='work')gong();
 else if(p.k==='sw'){beep(1000,.25,.85);say(['Seite wechseln.'])}
 else{gong();say(['cool1','cool2'])}
 upd();tickClocks();
}
function upd(){
 if(!R||R.i<0)return;const p=R.st[R.i];
 const doneS=R.st.slice(0,R.i).reduce((a,b)=>a+b.s,0)+(p.s-R.left);const rest=R.total-doneS;
 const s=document.getElementById('sec');if(s)s.textContent=Math.max(0,Math.ceil(R.left));
 const pg=document.getElementById('pg');if(pg)pg.style.width=(doneS/R.total*100)+'%';
 const re=document.getElementById('rest');if(re)re.textContent='noch '+Math.floor(rest/60)+':'+pad(Math.max(0,Math.ceil(rest%60)));
}
let last=0;
setInterval(()=>{
 const now=performance.now(),dt=(now-last)/1000;last=now;
 if(!R||R.i<0||R.paused||R.fin||dt>2)return;
 const p=R.st[R.i],before=Math.ceil(R.left);R.left-=dt;const after=Math.ceil(R.left);
 if(after!==before){
  if(p.k!=='work'&&after<=3&&after>0)beep(after===1?1100:800,.18,.85);
  if(p.k==='work'&&after<=3&&after>0)beep(600,.14,.7);
  if(p.k==='work'&&p.ex.side&&!p.part&&!R.half&&R.left<=p.s/2){R.half=true;beep(1000,.25,.85);say(['seite'])}
 }
 if(R.left<=0)next();else upd();
},200);
function finish(){
 R.fin=true;const d=new Date(),k=dk(d),e=S.log[k]||{};e.train=true;e.prog=cur().wk+cur().d;e.time=pad(d.getHours())+':'+pad(d.getMinutes());S.log[k]=e;save();
 try{wake?.release()}catch(x){}
 const st=stats(),g=got(st),neu=BADGES.filter(b=>g[b.id]&&!R.before[b.id]);
 say(['fin1','fin2',...neu.map(b=>'b_'+b.id)]);
 T.className='show done';
 T.innerHTML=`<div></div><div class="donebox"><h1>Geschafft!</h1>
 <div class="stats"><div class="card"><div class="meta">Serie</div><div class="big">${st.serie}</div></div><div class="card"><div class="meta">Diese Woche</div><div class="big">${st.week}/5</div></div><div class="card"><div class="meta">Einheiten gesamt</div><div class="big">${st.tot}</div></div></div>
 ${neu.map(b=>`<div class="new">Neues Abzeichen: ${b.n}. ${b.d}</div>`).join('')}
 <div class="card"><h3>Wie geht es den Knien?</h3>${S.names.map((n,i)=>`<div class="knee" style="margin-top:12px"><b>${esc(n)}</b><div class="amp" data-p="${i}"><button class="g" data-v="g">gut</button><button class="y" data-v="y">zwickt</button><button class="r" data-v="r">schmerzt</button></div></div>`).join('')}</div>
 <div class="card"><h3>Wie war's?</h3><div class="seg" style="margin-top:10px">${['zu leicht','passt','zu schwer'].map(x=>`<button data-f="${x}">${x}</button>`).join('')}</div></div>
 <button class="go" id="fin">Fertig, ab unter die Dusche</button></div><div></div>`;
 T.querySelectorAll('.amp').forEach(a=>a.onclick=ev=>{const b=ev.target.closest('button');if(!b)return;a.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));e.knee=e.knee||{};e.knee[a.dataset.p]=b.dataset.v;save()});
 T.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{T.querySelectorAll('[data-f]').forEach(x=>x.classList.toggle('on',x===b));e.fb=b.dataset.f;save()});
 document.getElementById('fin').onclick=close;
 confetti();
}
function close(){R=null;stopSay();try{wake?.release()}catch(e){}T.className='';T.innerHTML='';render()}
function confetti(){
 if(still)return;const c=document.getElementById('conf'),x=c.getContext&&c.getContext('2d');if(!x)return;c.classList.add('on');c.width=innerWidth;c.height=innerHeight;
 const cols=['#c06a55','#55658f','#e3c47e','#6f9f7f'];const ps=Array.from({length:140},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,v:2+Math.random()*4,r:Math.random()*6,s:5+Math.random()*7,c:cols[Math.random()*4|0]}));
 const t0=performance.now();(function f(t){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.y+=p.v;p.r+=.08;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(t-t0<3500)requestAnimationFrame(f);else{x.clearRect(0,0,c.width,c.height);c.classList.remove('on')}})(t0);
}
render();
if(!window.claude&&location.protocol==='https:'){try{navigator.serviceWorker&&navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}}
}
</script>
</body>
</html>
